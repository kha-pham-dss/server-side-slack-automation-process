AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Slack dishes ordering - Option A (scheduled Lambdas only, reactions.get)

# Config and secrets: SSM Parameter Store (free tier). Create parameters under /slack-dishes/ before first run.
# See config/parameter-store-keys.md. Do not commit tokens.

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 256
    Architectures:
      - arm64

Resources:
  MenuMessageTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: slack-dishes-menu-message
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  DishesMenuTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: slack-dishes-dishes-menu
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false

  PostMenuFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: slack-dishes-post-menu
      CodeUri: ../serverless/post-menu
      Handler: index.handler
      Description: Runs at 10:00 GMT+7 (VNT); reads menu from DM, posts to Slack, stores message_ts + dish list in DynamoDB.
      Environment:
        Variables:
          TABLE_NAME: !Ref MenuMessageTable
          DISHES_TABLE_NAME: !Ref DishesMenuTable
          PARAMETER_PREFIX: /slack-dishes
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes/*'
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource:
                - !GetAtt MenuMessageTable.Arn
                - !GetAtt DishesMenuTable.Arn
      Events:
        PostMenuSchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 ? * MON-FRI *)
            Name: post-menu-daily
            Description: Invoke PostMenu at 10:00 GMT+7 (VNT)
            Enabled: true

  SyncSlackIdsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: slack-dishes-sync-slack-ids
      CodeUri: ../serverless/sync-slack-ids
      Handler: index.handler
      Description: Manual invoke; maps sheet user names to Slack users.list and writes Slack user IDs to orders-slack-id-column (default BZ), same rows as orders-user-range.
      Environment:
        Variables:
          PARAMETER_PREFIX: /slack-dishes
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes/*'

  CollectOrdersFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: slack-dishes-collect-orders
      CodeUri: ../serverless/collect-orders
      Handler: index.handler
      Description: Invoked by Slack Events after @Mr.Chef under menu; reads reactions, writes sheet + Zalo summary cell (S62).
      Environment:
        Variables:
          TABLE_NAME: !Ref MenuMessageTable
          DISHES_TABLE_NAME: !Ref DishesMenuTable
          PARAMETER_PREFIX: /slack-dishes
          ZALO_SUMMARY_CELL: 'S62'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt MenuMessageTable.Arn
                - !GetAtt DishesMenuTable.Arn

  ZaloSheetSummaryFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: slack-dishes-zalo-sheet-summary
      CodeUri: ../serverless/zalo-sheet-summary
      Handler: index.handler
      Description: Runs at 11:00 GMT+7 (VNT); aggregates orders from Slack reactions, writes S62 + per-user prices, sends Zalo group message.
      Environment:
        Variables:
          PARAMETER_PREFIX: /slack-dishes
          TABLE_NAME: !Ref MenuMessageTable
          DISHES_TABLE_NAME: !Ref DishesMenuTable
          ZALO_SUMMARY_CELL: 'S62'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
                - ssm:GetParameters
                - ssm:GetParametersByPath
              Resource:
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes'
                - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource:
                - !GetAtt MenuMessageTable.Arn
                - !GetAtt DishesMenuTable.Arn
      Events:
        ZaloSheetSummarySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 4 ? * MON-FRI *)
            Name: zalo-sheet-summary-daily
            Description: Invoke Zalo sheet summary at 11:00 GMT+7 (VNT)
            Enabled: true

  SlackEventsFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      FunctionName: slack-dishes-slack-events
      CodeUri: ../serverless/slack-events
      Handler: index.handler
      Description: Receives Slack Events API; menu-thread @Mr.Chef → CollectOrders; after 11:00 GMT+7 updates sheet and pings RECONCILE_NOTIFY_SLACK_USER_ID with user order.
      Environment:
        Variables:
          TABLE_NAME: !Ref MenuMessageTable
          COLLECT_ORDERS_FUNCTION_NAME: !Ref CollectOrdersFunction
          PARAMETER_PREFIX: /slack-dishes
          # Slack user id (e.g. U01ABC…) for Mr.Chef; menu-thread replies must @-mention this user to trigger CollectOrders. Override SSM /slack-dishes/mr-chef-user-id when non-empty.
          MR_CHEF_SLACK_USER_ID: ''
          # @mention khi user @ bot dưới menu sau 11:00 GMT+7 (sau Zalo summary). Để trống = default trong code.
          RECONCILE_NOTIFY_SLACK_USER_ID: 'U02SJRNAM2M'
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/slack-dishes/*'
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt MenuMessageTable.Arn
            - Effect: Allow
              Action:
                - lambda:InvokeFunction
              Resource: !GetAtt CollectOrdersFunction.Arn
      FunctionUrlConfig:
        AuthType: NONE
        Cors:
          AllowOrigins:
            - '*'
          AllowMethods:
            - POST
          AllowHeaders:
            - '*'

Outputs:
  MenuMessageTableName:
    Description: DynamoDB table for menu message metadata (channel_id, message_ts)
    Value: !Ref MenuMessageTable
    Export:
      Name: !Sub '${AWS::StackName}-MenuMessageTable'
  DishesMenuTableName:
    Description: DynamoDB table for daily dish list from PostMenu
    Value: !Ref DishesMenuTable
    Export:
      Name: !Sub '${AWS::StackName}-DishesMenuTable'
  PostMenuFunctionArn:
    Description: PostMenu Lambda ARN
    Value: !GetAtt PostMenuFunction.Arn
  CollectOrdersFunctionArn:
    Description: CollectOrders Lambda ARN
    Value: !GetAtt CollectOrdersFunction.Arn
  SyncSlackIdsFunctionArn:
    Description: SyncSlackIds Lambda ARN (invoke manually to fill Slack user ID column on sheet)
    Value: !GetAtt SyncSlackIdsFunction.Arn
  ZaloSheetSummaryFunctionArn:
    Description: Zalo sheet summary Lambda ARN
    Value: !GetAtt ZaloSheetSummaryFunction.Arn
  SlackEventsFunctionUrl:
    Description: Slack Events API Request URL - set this in Slack app Event Subscriptions
    Value: !GetAtt SlackEventsFunctionUrl.FunctionUrl
  SlackEventsFunctionArn:
    Description: SlackEvents Lambda ARN
    Value: !GetAtt SlackEventsFunction.Arn
